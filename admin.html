<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — WK Académie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0A0D11;
    --surface:#12171E;
    --surface-2:#1A222B;
    --line: rgba(237,231,218,0.10);
    --gold:#C9A15D;
    --gold-soft: rgba(201,161,93,0.14);
    --emerald:#2E8B6E;
    --emerald-soft: rgba(46,139,110,0.14);
    --text:#EDE7DA;
    --muted:#8B95A1;
    --danger:#C97A6D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:500; }
  a{ color:inherit; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 24px; }

  nav{ border-bottom:1px solid var(--line); padding:20px 0; }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-family:'Fraunces', serif; font-size:1.1rem; font-weight:600; }
  .brand span{ color:var(--gold); }
  .btn-logout{
    font-size:0.82rem; color:var(--muted);
    border:1px solid var(--line);
    padding:8px 16px; border-radius:100px;
    cursor:pointer; background:none; font-family:inherit;
  }
  .btn-logout:hover{ color:var(--text); border-color:var(--muted); }

  main{ padding:50px 0 80px; }

  .auth-box{
    max-width:400px; margin:40px auto;
    background:var(--surface); border:1px solid var(--line);
    border-radius:20px; padding:40px 36px;
  }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.8rem; color:var(--muted); margin-bottom:6px; }
  .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; color:var(--text);
    font-family:inherit; font-size:0.92rem;
  }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .btn-primary{
    width:100%; background:var(--gold); color:var(--ink); border:none;
    padding:13px; border-radius:10px; font-weight:700; font-size:0.92rem;
    cursor:pointer; font-family:inherit; transition:opacity .2s ease;
  }
  .btn-primary:hover{ opacity:0.9; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .auth-error{ color:var(--danger); font-size:0.82rem; margin-top:12px; text-align:center; }

  .hello{ font-size:1.6rem; margin-bottom:6px; }
  .hello span{ color:var(--gold); }
  .sub{ color:var(--muted); font-size:0.92rem; margin-bottom:32px; }

  .stats-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:16px;
    margin-bottom:32px;
  }
  .stat-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:20px;
  }
  .stat-num{ font-family:'Fraunces', serif; font-size:1.7rem; color:var(--gold); }
  .stat-label{ font-size:0.78rem; color:var(--muted); margin-top:4px; }

  .search-box{
    margin-bottom:20px;
  }
  .search-box input{
    width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:13px 16px; color:var(--text);
    font-family:inherit; font-size:0.92rem;
  }
  .search-box input:focus{ outline:none; border-color:var(--gold); }

  .client-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:22px 24px; margin-bottom:14px;
  }
  .client-top{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; margin-bottom:14px;
  }
  .client-name{ font-family:'Fraunces', serif; font-size:1.1rem; color:#FBF9F4; }
  .client-code{
    font-size:0.72rem; color:var(--gold);
    background:var(--gold-soft); padding:3px 10px; border-radius:100px;
    margin-left:8px;
  }
  .client-date{ font-size:0.78rem; color:var(--muted); }

  .client-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;
  }
  .client-metric{ }
  .client-metric-label{ font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .client-metric-value{ font-size:0.95rem; font-weight:600; margin-top:3px; }
  .client-metric-value.gold{ color:var(--gold); }
  .client-metric-value.emerald{ color:var(--emerald); }
  .client-metric-value.muted{ color:var(--muted); font-weight:400; }

  .badges{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .badge{
    font-size:0.72rem; background:var(--emerald-soft); color:var(--emerald);
    padding:3px 10px; border-radius:100px; font-weight:600;
  }

  .empty-state{ color:var(--muted); text-align:center; padding:40px 0; }
  .loading{ text-align:center; padding:80px 20px; color:var(--muted); }

  @media (max-width:820px){
    .stats-grid{ grid-template-columns:repeat(2, 1fr); }
    .client-grid{ grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">WK <span>Académie</span> — Admin</div>
    <button class="btn-logout" id="logoutBtn" style="display:none;">Se déconnecter</button>
  </div>
</nav>

<main>
  <div class="wrap" id="app">
    <div class="loading">Chargement…</div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://yvsddohdmkttbriguagi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bxEPsHgetf2E7-14l1t6Fw_ljWbjLkc';

let supa;
try{
  supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(err){
  document.getElementById('app').innerHTML = `<div class="loading" style="color:var(--danger);">Erreur de chargement de Supabase.</div>`;
  throw err;
}

const app = document.getElementById('app');
const logoutBtn = document.getElementById('logoutBtn');

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function fmtMoney(n){
  return n > 0 ? n.toLocaleString('fr-FR') + ' €' : '—';
}

function fmtDate(iso){
  return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
}

// ---------- AUTH SCREEN ----------
function renderAuth(errorMsg){
  app.innerHTML = `
    <div class="auth-box">
      <h2 style="margin-bottom:20px;">Connexion admin</h2>
      <div class="field"><label>Email</label><input type="email" id="loginEmail" /></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="loginPassword" /></div>
      <button class="btn-primary" id="loginBtn">Se connecter</button>
      ${errorMsg ? `<div class="auth-error">${errorMsg}</div>` : ''}
    </div>
  `;
  document.getElementById('loginBtn').onclick = handleLogin;
}

async function handleLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;

  const { error } = await supa.auth.signInWithPassword({ email, password });
  if(error){
    renderAuth('Email ou mot de passe incorrect.');
  } else {
    loadAdmin();
  }
}

// ---------- ADMIN DASHBOARD ----------
let ALL_CLIENTS = [];

async function loadAdmin(){
  app.innerHTML = `<div class="loading">Chargement…</div>`;
  logoutBtn.style.display = 'inline-block';

  const { data: { user } } = await supa.auth.getUser();
  if(!user){ logoutBtn.style.display = 'none'; renderAuth(); return; }

  const { data: myProfile } = await supa
    .from('profiles')
    .select('is_admin, full_name')
    .eq('id', user.id)
    .single();

  if(!myProfile?.is_admin){
    logoutBtn.style.display = 'none';
    await supa.auth.signOut();
    renderAuth("Ce compte n'a pas accès à l'espace admin.");
    return;
  }

  const [{ data: profiles }, { data: pointsRows }, { data: redemptions }] = await Promise.all([
    supa.from('profiles').select('id, full_name, invested_amount, referral_code, referred_by, created_at, is_admin').order('created_at', { ascending: false }),
    supa.from('available_points').select('user_id, available_points, earned_points, spent_points'),
    supa.from('reward_redemptions').select('user_id, level_name, points_spent, created_at')
  ]);

  const nameById = {};
  (profiles || []).forEach(p => { nameById[p.id] = p.full_name; });

  const pointsById = {};
  (pointsRows || []).forEach(p => { pointsById[p.user_id] = p; });

  const redemptionsById = {};
  (redemptions || []).forEach(r => {
    if(!redemptionsById[r.user_id]) redemptionsById[r.user_id] = [];
    redemptionsById[r.user_id].push(r);
  });

  ALL_CLIENTS = (profiles || [])
    .filter(p => !p.is_admin)
    .map(p => ({
      ...p,
      referrer_name: p.referred_by ? nameById[p.referred_by] : null,
      points: pointsById[p.id] || { available_points: 0, earned_points: 0, spent_points: 0 },
      redemptions: redemptionsById[p.id] || []
    }));

  renderAdmin(myProfile.full_name);
}

function renderAdmin(adminName){
  const totalClients = ALL_CLIENTS.length;
  const totalInvested = ALL_CLIENTS.reduce((sum, c) => sum + (c.invested_amount || 0), 0);
  const totalPointsEarned = ALL_CLIENTS.reduce((sum, c) => sum + (c.points.earned_points || 0), 0);
  const totalRedemptions = ALL_CLIENTS.reduce((sum, c) => sum + c.redemptions.length, 0);

  app.innerHTML = `
    <h2 class="hello">Bonjour <span>${escapeHtml(adminName)}</span> 👋</h2>
    <p class="sub">Vue d'ensemble de tous les clients WK Académie.</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num">${totalClients}</div>
        <div class="stat-label">Clients inscrits</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalInvested.toLocaleString('fr-FR')} €</div>
        <div class="stat-label">Total investi (déclaré)</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalPointsEarned}</div>
        <div class="stat-label">Points générés au total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalRedemptions}</div>
        <div class="stat-label">Cadeaux réclamés</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher un client par nom…" />
    </div>

    <div id="clientList"></div>
  `;

  document.getElementById('searchInput').addEventListener('input', (e) => {
    renderClientList(e.target.value.toLowerCase());
  });

  renderClientList('');
}

function renderClientList(filter){
  const listEl = document.getElementById('clientList');
  const filtered = ALL_CLIENTS.filter(c => c.full_name.toLowerCase().includes(filter));

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty-state">Aucun client ne correspond à cette recherche.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(c => `
    <div class="client-card">
      <div class="client-top">
        <div>
          <span class="client-name">${escapeHtml(c.full_name)}</span>
          <span class="client-code">${escapeHtml(c.referral_code)}</span>
        </div>
        <div class="client-date">Inscrit le ${fmtDate(c.created_at)}</div>
      </div>
      <div class="client-grid">
        <div class="client-metric">
          <div class="client-metric-label">Montant investi</div>
          <div class="client-metric-value gold">${fmtMoney(c.invested_amount)}</div>
        </div>
        <div class="client-metric">
          <div class="client-metric-label">Parrainé par</div>
          <div class="client-metric-value muted">${c.referrer_name ? escapeHtml(c.referrer_name) : 'Direct'}</div>
        </div>
        <div class="client-metric">
          <div class="client-metric-label">Points disponibles</div>
          <div class="client-metric-value emerald">${c.points.available_points}</div>
        </div>
        <div class="client-metric">
          <div class="client-metric-label">Points gagnés au total</div>
          <div class="client-metric-value muted">${c.points.earned_points}</div>
        </div>
      </div>
      ${c.redemptions.length > 0 ? `
        <div class="badges">
          ${c.redemptions.map(r => `<span class="badge">🎁 ${escapeHtml(r.level_name)}</span>`).join('')}
        </div>
      ` : ''}
    </div>
  `).join('');
}

logoutBtn.onclick = async () => {
  await supa.auth.signOut();
  logoutBtn.style.display = 'none';
  renderAuth();
};

// ---------- INIT ----------
(async function init(){
  try{
    const { data: { session } } = await supa.auth.getSession();
    if(session){
      loadAdmin();
    } else {
      renderAuth();
    }
  } catch(err){
    app.innerHTML = `<div class="loading" style="color:var(--danger);">Erreur : ${escapeHtml(err.message || String(err))}</div>`;
  }
})();
</script>

</body>
</html>
