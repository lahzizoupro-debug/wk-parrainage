<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Client — WK Académie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0A0D11;
    --surface:#12171E;
    --surface-2:#1A222B;
    --line: rgba(237,231,218,0.10);
    --gold:#C9A15D;
    --gold-soft: rgba(201,161,93,0.14);
    --emerald:#2E8B6E;
    --emerald-soft: rgba(46,139,110,0.14);
    --text:#EDE7DA;
    --muted:#8B95A1;
    --danger:#C97A6D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:500; }
  a{ color:inherit; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 24px; }

  nav{
    border-bottom:1px solid var(--line);
    padding:20px 0;
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-family:'Fraunces', serif; font-size:1.1rem; font-weight:600; }
  .brand span{ color:var(--gold); }
  .btn-logout{
    font-size:0.82rem; color:var(--muted);
    border:1px solid var(--line);
    padding:8px 16px; border-radius:100px;
    cursor:pointer; background:none;
    font-family:inherit;
  }
  .btn-logout:hover{ color:var(--text); border-color:var(--muted); }

  main{ padding:50px 0 80px; }

  /* ---- Auth screens ---- */
  .auth-box{
    max-width:400px;
    margin:40px auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px 36px;
  }
  .auth-tabs{
    display:flex;
    gap:4px;
    background:var(--surface-2);
    padding:4px;
    border-radius:100px;
    margin-bottom:28px;
  }
  .auth-tab{
    flex:1;
    text-align:center;
    padding:9px;
    border-radius:100px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
    transition:background .2s ease, color .2s ease;
  }
  .auth-tab.active{ background:var(--gold); color:var(--ink); }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:0.8rem; color:var(--muted); margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:0.92rem;
  }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .ref-note{
    background:var(--gold-soft);
    border:1px solid rgba(201,161,93,0.3);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.82rem;
    margin-bottom:16px;
  }
  .ref-note strong{ color:var(--gold); }
  .btn-primary{
    width:100%;
    background:var(--gold);
    color:var(--ink);
    border:none;
    padding:13px;
    border-radius:10px;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
    font-family:inherit;
    transition:opacity .2s ease;
  }
  .btn-primary:hover{ opacity:0.9; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .auth-error{
    color:var(--danger);
    font-size:0.82rem;
    margin-top:12px;
    text-align:center;
  }
  .auth-msg{
    color:var(--emerald);
    font-size:0.82rem;
    margin-top:12px;
    text-align:center;
  }

  /* ---- Dashboard ---- */
  .hello{ font-size:1.6rem; margin-bottom:6px; }
  .hello span{ color:var(--gold); }
  .sub{ color:var(--muted); font-size:0.92rem; margin-bottom:36px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 26px;
    margin-bottom:22px;
  }
  .card h3{ font-size:1.05rem; color:#FBF9F4; margin-bottom:16px; }

  /* Referral link box */
  .ref-link-box{
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .ref-link-input{
    flex:1; min-width:200px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:0.88rem;
  }
  .btn-copy{
    background:var(--gold); color:var(--ink);
    border:none; border-radius:10px;
    padding:0 20px;
    font-weight:700; font-size:0.85rem;
    cursor:pointer; font-family:inherit;
  }

  /* Level / points */
  .level-row{
    display:flex; align-items:center; gap:16px;
    margin-bottom:18px;
  }
  .level-badge{
    font-size:2rem;
  }
  .level-name{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    color:#FBF9F4;
  }
  .level-points{
    font-size:0.85rem;
    color:var(--muted);
  }
  .progress-track{
    height:10px;
    background:var(--surface-2);
    border-radius:100px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--gold), var(--emerald));
    border-radius:100px;
    transition:width 1.1s cubic-bezier(.22,.9,.3,1);
    position:relative;
    overflow:hidden;
  }
  .progress-fill::after{
    content:'';
    position:absolute; top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: progress-shine 2.2s ease-in-out infinite;
  }
  @keyframes progress-shine{
    0%{ left:-60%; }
    100%{ left:130%; }
  }
  .progress-label{
    margin-top:8px;
    font-size:0.8rem;
    color:var(--muted);
  }

  /* Rewards list */
  /* Points wallet */
  .points-total{
    font-family:'Fraunces', serif;
    font-size:2.4rem;
    color:var(--gold);
    display:flex; align-items:baseline; gap:8px;
  }
  .points-label{
    font-family:'Inter', sans-serif;
    font-size:1rem;
    color:var(--muted);
    font-weight:500;
  }
  .points-hint{
    margin-top:10px;
    font-size:0.85rem;
    color:var(--muted);
  }

  .reward-row{
    display:flex; align-items:center; gap:14px;
    padding:16px 14px;
    margin:0 -14px;
    border-bottom:1px solid var(--line);
    border-radius:12px;
    transition:background .3s ease, box-shadow .3s ease;
  }
  .reward-row:last-child{ border-bottom:none; }
  .reward-info{ flex:1; min-width:0; }
  .reward-icon{
    width:36px; height:36px; flex-shrink:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.1rem;
  }
  .reward-row.claimed .reward-icon{ background:var(--emerald-soft); }
  .reward-row.claimable .reward-icon{ background:var(--gold-soft); }
  .reward-row.locked .reward-icon{ background:var(--surface-2); filter:grayscale(1); opacity:0.5; }
  .reward-name{ font-weight:600; font-size:0.92rem; }
  .reward-row.locked .reward-name{ color:var(--muted); }
  .reward-desc{ font-size:0.8rem; color:var(--muted); }
  .reward-check{ margin-left:auto; color:var(--emerald); font-size:0.85rem; font-weight:600; flex-shrink:0; }
  .reward-missing{ margin-left:auto; color:var(--muted); font-size:0.78rem; flex-shrink:0; white-space:nowrap; }

  /* Palier "lumineux" = accessible dès maintenant */
  .reward-row.claimable{
    background:rgba(201,161,93,0.07);
    box-shadow:0 0 0 1px rgba(201,161,93,0.3), 0 0 22px -4px rgba(201,161,93,0.35);
    animation: reward-pulse-glow 2.2s ease-in-out infinite;
  }
  @keyframes reward-pulse-glow{
    0%,100%{ box-shadow:0 0 0 1px rgba(201,161,93,0.3), 0 0 14px -6px rgba(201,161,93,0.3); }
    50%{ box-shadow:0 0 0 1px rgba(201,161,93,0.55), 0 0 26px -4px rgba(201,161,93,0.55); }
  }
  .claim-btn{
    margin-left:auto;
    flex-shrink:0;
    background:var(--gold);
    color:var(--ink);
    border:none;
    border-radius:100px;
    padding:9px 20px;
    font-weight:700;
    font-size:0.82rem;
    cursor:pointer;
    font-family:inherit;
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .claim-btn:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 8px 20px -10px rgba(201,161,93,0.6);
  }
  .claim-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  @media (prefers-reduced-motion: reduce){
    .reward-row.claimable{ animation:none; }
  }

  @media (max-width:560px){
    .reward-row{ flex-wrap:wrap; }
    .claim-btn, .reward-check, .reward-missing{ margin-left:50px; }
  }

  /* Invested amount */
  .invested-current{
    font-family:'Fraunces', serif;
    font-size:1.8rem;
    color:var(--gold);
    margin-bottom:4px;
  }
  .invested-note{ font-size:0.8rem; color:var(--muted); margin-bottom:18px; }
  .invested-form{ display:flex; gap:10px; flex-wrap:wrap; }
  .invested-form input{
    flex:1; min-width:160px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:0.92rem;
  }
  .invested-form button{
    background:var(--emerald); color:#FBF9F4;
    border:none; border-radius:10px;
    padding:0 22px;
    font-weight:700; font-size:0.85rem;
    cursor:pointer; font-family:inherit;
  }
  .invested-hint{ font-size:0.78rem; color:var(--muted); margin-top:8px; }

  /* Referral list */
  .filleul-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:0.9rem;
  }
  .filleul-row:last-child{ border-bottom:none; }
  .filleul-points{
    color:var(--emerald);
    font-weight:600;
    font-size:0.85rem;
  }
  .empty-state{
    color:var(--muted);
    font-size:0.88rem;
    text-align:center;
    padding:20px 0;
  }

  .loading{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--emerald); color:#fff;
    padding:12px 22px; border-radius:100px;
    font-size:0.85rem; font-weight:600;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:200;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (max-width:560px){
    .auth-box{ padding:30px 24px; }
    .card{ padding:22px 18px; }
  }

  /* ---- Animations générales ---- */
  @keyframes card-in{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card, .auth-box{
    animation: card-in .55s ease both;
  }
  .card:nth-of-type(1){ animation-delay:.05s; }
  .card:nth-of-type(2){ animation-delay:.15s; }
  .card:nth-of-type(3){ animation-delay:.25s; }
  .card:nth-of-type(4){ animation-delay:.35s; }
  .card:nth-of-type(5){ animation-delay:.45s; }

  .hello, .sub{
    animation: card-in .5s ease both;
  }

  .card{
    transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(201,161,93,0.3);
    box-shadow:0 16px 36px -24px rgba(201,161,93,0.35);
  }

  .btn-primary, .btn-copy, .invested-form button{
    transition:transform .18s ease, opacity .18s ease, box-shadow .18s ease;
  }
  .btn-primary:hover:not(:disabled), .btn-copy:hover, .invested-form button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px -12px rgba(201,161,93,0.5);
  }
  .btn-primary:active:not(:disabled), .btn-copy:active, .invested-form button:active{
    transform:translateY(0);
  }

  .level-badge{
    display:inline-block;
    animation: badge-pop .6s cubic-bezier(.34,1.56,.64,1) both;
    animation-delay:.3s;
  }
  @keyframes badge-pop{
    from{ transform:scale(0.4); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .field input, .invested-form input{
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus, .invested-form input:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,161,93,0.15);
  }

  .auth-tab{ transition:background .25s ease, color .25s ease; }

  @media (prefers-reduced-motion: reduce){
    .card, .auth-box, .hello, .sub, .level-badge{ animation:none !important; }
    .progress-fill::after{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="wrap">
