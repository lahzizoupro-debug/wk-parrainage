<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Client — WK Académie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0A0D11;
    --surface:#12171E;
    --surface-2:#1A222B;
    --line: rgba(237,231,218,0.10);
    --gold:#C9A15D;
    --gold-soft: rgba(201,161,93,0.14);
    --emerald:#2E8B6E;
    --emerald-soft: rgba(46,139,110,0.14);
    --text:#EDE7DA;
    --muted:#8B95A1;
    --danger:#C97A6D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:500; }
  a{ color:inherit; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 24px; }

  nav{
    border-bottom:1px solid var(--line);
    padding:20px 0;
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-family:'Fraunces', serif; font-size:1.1rem; font-weight:600; }
  .brand span{ color:var(--gold); }
  .btn-logout{
    font-size:0.82rem; color:var(--muted);
    border:1px solid var(--line);
    padding:8px 16px; border-radius:100px;
    cursor:pointer; background:none;
    font-family:inherit;
  }
  .btn-logout:hover{ color:var(--text); border-color:var(--muted); }

  main{ padding:50px 0 80px; }

  /* ---- Auth screens ---- */
  .auth-box{
    max-width:400px;
    margin:40px auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px 36px;
  }
  .auth-tabs{
    display:flex;
    gap:4px;
    background:var(--surface-2);
    padding:4px;
    border-radius:100px;
    margin-bottom:28px;
  }
  .auth-tab{
    flex:1;
    text-align:center;
    padding:9px;
    border-radius:100px;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
    transition:background .2s ease, color .2s ease;
  }
  .auth-tab.active{ background:var(--gold); color:var(--ink); }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:0.8rem; color:var(--muted); margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:0.92rem;
  }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .ref-note{
    background:var(--gold-soft);
    border:1px solid rgba(201,161,93,0.3);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.82rem;
    margin-bottom:16px;
  }
  .ref-note strong{ color:var(--gold); }
  .btn-primary{
    width:100%;
    background:var(--gold);
    color:var(--ink);
    border:none;
    padding:13px;
    border-radius:10px;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
    font-family:inherit;
    transition:opacity .2s ease;
  }
  .btn-primary:hover{ opacity:0.9; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .auth-error{
    color:var(--danger);
    font-size:0.82rem;
    margin-top:12px;
    text-align:center;
  }
  .auth-msg{
    color:var(--emerald);
    font-size:0.82rem;
    margin-top:12px;
    text-align:center;
  }

  /* ---- Dashboard ---- */
  .hello{ font-size:1.6rem; margin-bottom:6px; }
  .hello span{ color:var(--gold); }
  .sub{ color:var(--muted); font-size:0.92rem; margin-bottom:36px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 26px;
    margin-bottom:22px;
  }
  .card h3{ font-size:1.05rem; color:#FBF9F4; margin-bottom:16px; }

  /* Referral link box */
  .ref-link-box{
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .ref-link-input{
    flex:1; min-width:200px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:0.88rem;
  }
  .btn-copy{
    background:var(--gold); color:var(--ink);
    border:none; border-radius:10px;
    padding:0 20px;
    font-weight:700; font-size:0.85rem;
    cursor:pointer; font-family:inherit;
  }

  /* Level / points */
  .level-row{
    display:flex; align-items:center; gap:16px;
    margin-bottom:18px;
  }
  .level-badge{
    font-size:2rem;
  }
  .level-name{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    color:#FBF9F4;
  }
  .level-points{
    font-size:0.85rem;
    color:var(--muted);
  }
  .progress-track{
    height:8px;
    background:var(--surface-2);
    border-radius:100px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--emerald));
    border-radius:100px;
    transition:width .6s ease;
  }
  .progress-label{
    margin-top:8px;
    font-size:0.8rem;
    color:var(--muted);
  }

  /* Rewards list */
  .reward-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .reward-row:last-child{ border-bottom:none; }
  .reward-icon{
    width:36px; height:36px; flex-shrink:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.1rem;
  }
  .reward-row.unlocked .reward-icon{ background:var(--gold-soft); }
  .reward-row.locked .reward-icon{ background:var(--surface-2); filter:grayscale(1); opacity:0.5; }
  .reward-name{ font-weight:600; font-size:0.92rem; }
  .reward-row.locked .reward-name{ color:var(--muted); }
  .reward-desc{ font-size:0.8rem; color:var(--muted); }
  .reward-check{ margin-left:auto; color:var(--emerald); font-size:0.85rem; font-weight:600; }

  /* Invested amount */
  .invested-current{
    font-family:'Fraunces', serif;
    font-size:1.8rem;
    color:var(--gold);
    margin-bottom:4px;
  }
  .invested-note{ font-size:0.8rem; color:var(--muted); margin-bottom:18px; }
  .invested-form{ display:flex; gap:10px; flex-wrap:wrap; }
  .invested-form input{
    flex:1; min-width:160px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:0.92rem;
  }
  .invested-form button{
    background:var(--emerald); color:#FBF9F4;
    border:none; border-radius:10px;
    padding:0 22px;
    font-weight:700; font-size:0.85rem;
    cursor:pointer; font-family:inherit;
  }
  .invested-hint{ font-size:0.78rem; color:var(--muted); margin-top:8px; }

  /* Referral list */
  .filleul-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:0.9rem;
  }
  .filleul-row:last-child{ border-bottom:none; }
  .filleul-points{
    color:var(--emerald);
    font-weight:600;
    font-size:0.85rem;
  }
  .empty-state{
    color:var(--muted);
    font-size:0.88rem;
    text-align:center;
    padding:20px 0;
  }

  .loading{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--emerald); color:#fff;
    padding:12px 22px; border-radius:100px;
    font-size:0.85rem; font-weight:600;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:200;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (max-width:560px){
    .auth-box{ padding:30px 24px; }
    .card{ padding:22px 18px; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">WK <span>Académie</span> — Espace parrainage</div>
    <button class="btn-logout" id="logoutBtn" style="display:none;">Se déconnecter</button>
  </div>
</nav>

<main>
  <div class="wrap" id="app">
    <div class="loading">Chargement…</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://yvsddohdmkttbriguagi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bxEPsHgetf2E7-14l1t6Fw_ljWbjLkc';

let supa;
try{
  supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(err){
  document.getElementById('app').innerHTML = `<div class="loading" style="color:var(--danger); text-align:left; max-width:600px; margin:40px auto;">
    <strong>Erreur : la librairie Supabase ne s'est pas chargée.</strong><br><br>
    ${err.message || String(err)}
    <br><br>
    <span style="color:var(--muted); font-size:0.85rem;">Vérifie ta connexion et recharge la page. Si ça persiste, envoie ce message.</span>
  </div>`;
  throw err;
}

const LEVELS = [
  { name: 'Bronze', icon: '🥉', points: 10, reward: 'Badge Bronze + accès au canal "Parrains"' },
  { name: 'Argent', icon: '🥈', points: 30, reward: '-25% sur ton abonnement du mois suivant' },
  { name: 'Or', icon: '🥇', points: 60, reward: "1 mois d'abonnement offert" },
  { name: 'Platine', icon: '💎', points: 120, reward: '2 mois offerts + appel privé stratégie' },
  { name: 'Légende', icon: '👑', points: 250, reward: 'Abonnement à vie + statut Ambassadeur WK' }
];

const app = document.getElementById('app');
const logoutBtn = document.getElementById('logoutBtn');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function getRefCodeFromURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get('ref');
}

function getReferralLink(code){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('ref', code);
  return url.toString();
}

function currentLevel(points){
  let level = null;
  for(const l of LEVELS){
    if(points >= l.points) level = l;
  }
  return level;
}

function nextLevel(points){
  return LEVELS.find(l => points < l.points) || null;
}

// ---------- AUTH SCREEN ----------
function renderAuth(){
  const refCode = getRefCodeFromURL();
  app.innerHTML = `
    <div class="auth-box">
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Connexion</div>
        <div class="auth-tab" data-tab="signup">Créer un compte</div>
      </div>
      ${refCode ? `<div class="ref-note" id="refNote">🎁 Tu as été invité avec le code <strong>${refCode}</strong>. Il sera appliqué à ton inscription.</div>` : ''}
      <div id="authForm"></div>
    </div>
  `;

  const tabs = app.querySelectorAll('.auth-tab');
  let mode = 'login';

  function renderForm(){
    const refNote = document.getElementById('refNote');
    if(refNote) refNote.style.display = mode === 'signup' ? 'block' : 'none';

    const formEl = document.getElementById('authForm');
    if(mode === 'login'){
      formEl.innerHTML = `
        <div class="field"><label>Email</label><input type="email" id="loginEmail" /></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="loginPassword" /></div>
        <button class="btn-primary" id="loginBtn">Se connecter</button>
        <div id="authMsg"></div>
      `;
      document.getElementById('loginBtn').onclick = handleLogin;
    } else {
      formEl.innerHTML = `
        <div class="field"><label>Nom complet</label><input type="text" id="signupName" /></div>
        <div class="field"><label>Email</label><input type="email" id="signupEmail" /></div>
        <div class="field"><label>Mot de passe (6 caractères min.)</label><input type="password" id="signupPassword" /></div>
        <button class="btn-primary" id="signupBtn">Créer mon compte</button>
        <div id="authMsg"></div>
      `;
      document.getElementById('signupBtn').onclick = handleSignup;
    }
  }

  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      mode = tab.dataset.tab;
      renderForm();
    };
  });

  renderForm();
}

async function handleLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('authMsg');
  btn.disabled = true;
  msg.innerHTML = '';

  const { error } = await supa.auth.signInWithPassword({ email, password });
  if(error){
    msg.innerHTML = `<div class="auth-error">${translateError(error.message)}</div>`;
    btn.disabled = false;
  } else {
    loadDashboard();
  }
}

async function handleSignup(){
  const full_name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const btn = document.getElementById('signupBtn');
  const msg = document.getElementById('authMsg');
  const refCode = getRefCodeFromURL();

  if(!full_name || !email || password.length < 6){
    msg.innerHTML = `<div class="auth-error">Merci de remplir tous les champs (mot de passe 6 caractères min.)</div>`;
    return;
  }

  btn.disabled = true;
  msg.innerHTML = '';

  const { error } = await supa.auth.signUp({
    email, password,
    options: {
      data: { full_name, referred_by_code: refCode || null }
    }
  });

  if(error){
    msg.innerHTML = `<div class="auth-error">${translateError(error.message)}</div>`;
    btn.disabled = false;
  } else {
    msg.innerHTML = `<div class="auth-msg">Compte créé ! Tu peux maintenant te connecter.</div>`;
    btn.disabled = false;
  }
}

function translateError(msg){
  if(msg.includes('Invalid login credentials')) return 'Email ou mot de passe incorrect.';
  if(msg.includes('already registered')) return 'Un compte existe déjà avec cet email.';
  if(msg.includes('Password should be')) return 'Le mot de passe doit faire au moins 6 caractères.';
  return msg;
}

// ---------- DASHBOARD ----------
async function loadDashboard(){
  app.innerHTML = `<div class="loading">Chargement de ton espace…</div>`;
  logoutBtn.style.display = 'inline-block';

  const { data: { user } } = await supa.auth.getUser();
  if(!user){ renderAuth(); logoutBtn.style.display = 'none'; return; }

  const { data: profile, error: profileErr } = await supa
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  if(profileErr || !profile){
    app.innerHTML = `<div class="loading">Erreur de chargement du profil. Réessaie de te reconnecter.</div>`;
    return;
  }

  const { data: pointsRow } = await supa
    .from('referral_points')
    .select('points')
    .eq('user_id', user.id)
    .single();
  const points = pointsRow?.points || 0;

  const { data: filleuls } = await supa
    .from('profiles')
    .select('full_name, invested_amount, created_at')
    .eq('referred_by', user.id)
    .order('created_at', { ascending: false });

  renderDashboard(profile, points, filleuls || []);
}

function pointsForAmount(amount){
  if(amount >= 5000) return 50;
  if(amount >= 2500) return 30;
  if(amount >= 1000) return 20;
  if(amount >= 500) return 10;
  return 0;
}

function renderDashboard(profile, points, filleuls){
  const level = currentLevel(points);
  const next = nextLevel(points);
  const prevThreshold = level ? level.points : 0;
  const nextThreshold = next ? next.points : (level ? level.points : LEVELS[0].points);
  const progressPct = next
    ? Math.min(100, Math.round(((points - prevThreshold) / (nextThreshold - prevThreshold)) * 100))
    : 100;

  const refLink = getReferralLink(profile.referral_code);

  app.innerHTML = `
    <h2 class="hello">Bonjour <span>${escapeHtml(profile.full_name)}</span> 👋</h2>
    <p class="sub">Voici ton espace de parrainage WK Académie.</p>

    <div class="card">
      <h3>Ton lien de parrainage</h3>
      <div class="ref-link-box">
        <input class="ref-link-input" id="refLinkInput" readonly value="${refLink}" />
        <button class="btn-copy" id="copyBtn">Copier</button>
      </div>
    </div>

    <div class="card">
      <h3>Ton niveau</h3>
      <div class="level-row">
        <div class="level-badge">${level ? level.icon : '🔹'}</div>
        <div>
          <div class="level-name">${level ? level.name : 'Aucun niveau atteint'}</div>
          <div class="level-points">${points} points</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%;"></div></div>
      <div class="progress-label">
        ${next ? `${points} / ${next.points} points pour atteindre ${next.name} ${next.icon}` : 'Niveau maximum atteint 🎉'}
      </div>
    </div>

    <div class="card">
      <h3>Récompenses par niveau</h3>
      ${LEVELS.map(l => `
        <div class="reward-row ${points >= l.points ? 'unlocked' : 'locked'}">
          <div class="reward-icon">${l.icon}</div>
          <div>
            <div class="reward-name">${l.name} — ${l.points} points</div>
            <div class="reward-desc">${l.reward}</div>
          </div>
          ${points >= l.points ? '<div class="reward-check">Débloqué ✓</div>' : ''}
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>Ton montant investi</h3>
      <div class="invested-current">${profile.invested_amount > 0 ? profile.invested_amount.toLocaleString('fr-FR') + ' €' : 'Non renseigné'}</div>
      <div class="invested-note">Ce montant sert à calculer les points que tu rapportes à la personne qui t'a parrainé. Minimum 500 €.</div>
      <div class="invested-form">
        <input type="number" id="investedInput" min="500" step="50" placeholder="Ex: 1000" />
        <button id="investedBtn">Mettre à jour</button>
      </div>
      <div id="investedMsg"></div>
    </div>

    <div class="card">
      <h3>Tes filleuls (${filleuls.length})</h3>
      ${filleuls.length === 0
        ? "<div class=\"empty-state\">Personne parrainé pour l'instant. Partage ton lien pour commencer à gagner des points !</div>"
        : filleuls.map(f => `
          <div class="filleul-row">
            <span>${escapeHtml(f.full_name)}</span>
            <span class="filleul-points">${f.invested_amount > 0 ? '+' + pointsForAmount(f.invested_amount) + ' pts' : 'En attente'}</span>
          </div>
        `).join('')
      }
    </div>
  `;

  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(refLink);
    showToast('Lien copié !');
  };

  document.getElementById('investedBtn').onclick = async () => {
    const val = parseFloat(document.getElementById('investedInput').value);
    const msg = document.getElementById('investedMsg');
    if(!val || val < 500){
      msg.innerHTML = `<div class="auth-error" style="text-align:left; margin-top:10px;">Le montant minimum accepté est 500 €.</div>`;
      return;
    }
    const { error } = await supa
      .from('profiles')
      .update({ invested_amount: val })
      .eq('id', profile.id);

    if(error){
      msg.innerHTML = `<div class="auth-error" style="text-align:left; margin-top:10px;">Erreur, réessaie.</div>`;
    } else {
      showToast('Montant mis à jour !');
      loadDashboard();
    }
  };
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

logoutBtn.onclick = async () => {
  await supa.auth.signOut();
  logoutBtn.style.display = 'none';
  renderAuth();
};

// ---------- INIT ----------
(async function init(){
  try{
    const { data: { session }, error } = await supa.auth.getSession();
    if(error) throw error;
    if(session){
      loadDashboard();
    } else {
      renderAuth();
    }
  } catch(err){
    app.innerHTML = `<div class="loading" style="color:var(--danger); text-align:left; max-width:600px; margin:40px auto;">
      <strong>Erreur de chargement :</strong><br><br>
      ${escapeHtml(err.message || String(err))}
      <br><br>
      <span style="color:var(--muted); font-size:0.85rem;">Envoie ce message pour obtenir de l'aide.</span>
    </div>`;
  }
})();
</script>

</body>
</html>
